name: Test and deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright-core install --with-deps chromium

      - name: Test static site
        run: |
          set -euo pipefail
          server_log="${RUNNER_TEMP}/recruitment-site-server.log"
          python3 -m http.server 4173 --bind 127.0.0.1 >"${server_log}" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4173/" >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${server_log}"
              exit 1
            fi
            sleep 1
          done
          if [[ "${ready}" != 'true' ]]; then
            cat "${server_log}"
            exit 1
          fi

          SITE_URL="http://127.0.0.1:4173" npm test

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Stage static site
        run: |
          site_dir="${RUNNER_TEMP}/recruitment-site"
          mkdir -p "${site_dir}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            --exclude='audio/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='node_modules/' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ "${site_dir}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/recruitment-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
