name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clear competing Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          KNOWN_STALE_SHA: c8bed1bf48b505e962528c53c117a64c22a91d4f
        run: |
          set -euo pipefail
          api_headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          response_file="${RUNNER_TEMP}/pages-deployment.json"

          cancel_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${KNOWN_STALE_SHA}/cancel")
          if [[ "${cancel_code}" != '204' && "${cancel_code}" != '404' ]]; then
            echo "::error title=Stale Pages cancellation failed::$(jq --compact-output . "${response_file}")"
            exit 1
          fi

          for attempt in {1..12}; do
            status_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}")
            if [[ "${status_code}" == '404' ]]; then
              sleep 3
              continue
            fi
            if [[ "${status_code}" != '200' ]]; then
              echo "::error title=Pages status request failed::$(jq --compact-output . "${response_file}")"
              exit 1
            fi
            deployment_status=$(jq --raw-output '.status' "${response_file}")
            if [[ "${deployment_status}" != 'succeed' ]]; then
              cancel_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
                --request POST \
                "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}/cancel")
              if [[ "${cancel_code}" != '204' && "${cancel_code}" != '404' ]]; then
                echo "::error title=Competing Pages cancellation failed::$(jq --compact-output . "${response_file}")"
                exit 1
              fi
              echo "Cancelled competing branch deployment ${GITHUB_SHA}."
            fi
            break
          done

      - name: Create deployment marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty --message 'Prepare lightweight Pages deployment [skip ci]'
          git push origin HEAD:main

      - name: Start lightweight deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dispatch_code=$(curl --silent --show-error --output "${RUNNER_TEMP}/workflow-dispatch.json" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --data '{"ref":"main"}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches")
          if [[ "${dispatch_code}" != '200' && "${dispatch_code}" != '204' ]]; then
            echo "::error title=Pages workflow dispatch failed::$(jq --compact-output . "${RUNNER_TEMP}/workflow-dispatch.json")"
            exit 1
          fi

  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Clear competing branch deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          response_file="${RUNNER_TEMP}/marker-deployment.json"

          for attempt in {1..12}; do
            status_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}")
            if [[ "${status_code}" == '404' ]]; then
              sleep 3
              continue
            fi
            if [[ "${status_code}" != '200' ]]; then
              echo "::error title=Marker Pages status request failed::$(jq --compact-output . "${response_file}")"
              exit 1
            fi

            deployment_status=$(jq --raw-output '.status' "${response_file}")
            if [[ "${deployment_status}" != 'succeed' ]]; then
              cancel_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
                --request POST \
                "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}/cancel")
              if [[ "${cancel_code}" != '204' && "${cancel_code}" != '404' ]]; then
                echo "::error title=Marker Pages cancellation failed::$(jq --compact-output . "${response_file}")"
                exit 1
              fi
              echo "Cancelled competing branch deployment ${GITHUB_SHA}."
            fi
            break
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p "${RUNNER_TEMP}/recruitment-site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='audio/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='README.md' \
            ./ "${RUNNER_TEMP}/recruitment-site/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/recruitment-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
