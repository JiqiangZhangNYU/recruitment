name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p "${RUNNER_TEMP}/recruitment-site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='audio/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='README.md' \
            ./ "${RUNNER_TEMP}/recruitment-site/"

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/recruitment-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel competing branch deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/pages-branch-deployment.json"
          for attempt in {1..12}; do
            status_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}")
            if [[ "${status_code}" == '404' ]]; then
              sleep 3
              continue
            fi
            if [[ "${status_code}" != '200' ]]; then
              cat "${response_file}"
              exit 1
            fi
            deployment_status=$(jq --raw-output '.status' "${response_file}")
            if [[ "${deployment_status}" == 'queued' || "${deployment_status}" == 'in_progress' ]]; then
              cancel_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}/cancel")
              if [[ "${cancel_code}" != '204' ]]; then
                cat "${response_file}"
                exit 1
              fi
              echo "Cancelled competing branch deployment ${GITHUB_SHA}."
            fi
            break
          done

      - name: Deploy lightweight artifact
        id: deployment
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          response_file="${RUNNER_TEMP}/pages-deployment.json"
          oidc_response=$(curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")
          oidc_token=$(jq --exit-status --raw-output '.value' <<<"${oidc_response}")
          build_version=$(printf '%s' "${GITHUB_SHA}-${GITHUB_RUN_ID}" | sha1sum | cut --delimiter=' ' --fields=1)
          payload=$(jq --compact-output --null-input \
            --argjson artifact_id "${ARTIFACT_ID}" \
            --arg pages_build_version "${build_version}" \
            --arg oidc_token "${oidc_token}" \
            '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}')
          create_code=''
          for create_attempt in {1..5}; do
            create_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --request POST \
              "${api_headers[@]}" \
              --data "${payload}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments")
            if [[ "${create_code}" == '200' ]]; then
              break
            fi
            conflict_sha=$(jq --raw-output '.message // empty' "${response_file}" \
              | sed -n 's/.*Please cancel \([0-9a-f]\{40\}\) first.*/\1/p')
            if [[ "${create_code}" != '400' || -z "${conflict_sha}" ]]; then
              echo "::error title=Pages deployment request failed::$(jq --compact-output . "${response_file}")"
              exit 1
            fi
            cancel_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              --request POST \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${conflict_sha}/cancel")
            if [[ "${cancel_code}" != '204' && "${cancel_code}" != '404' ]]; then
              echo "::error title=Pages cancellation failed::$(jq --compact-output . "${response_file}")"
              exit 1
            fi
            echo "Cancelled conflicting Pages deployment ${conflict_sha}."
            sleep 5
          done
          if [[ "${create_code}" != '200' ]]; then
            echo '::error::Unable to create a Pages deployment after clearing five conflicts.'
            exit 1
          fi
          deployment_id=$(jq --exit-status --raw-output '.id // (.status_url | split("/") | last)' "${response_file}")
          page_url=$(jq --raw-output '.page_url // empty' "${response_file}")
          echo "page_url=${page_url}" >> "${GITHUB_OUTPUT}"
          echo "Created lightweight Pages deployment ${deployment_id}."

          for attempt in {1..120}; do
            sleep 5
            status_code=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}")
            if [[ "${status_code}" != '200' ]]; then
              continue
            fi
            deployment_status=$(jq --raw-output '.status' "${response_file}")
            echo "Pages deployment status: ${deployment_status}"
            case "${deployment_status}" in
              succeed)
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                exit 1
                ;;
            esac
          done

          curl --silent --show-error --output /dev/null \
            --request POST \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}/cancel"
          echo 'Pages deployment timed out after 10 minutes.'
          exit 1
